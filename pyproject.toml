[project]
name = "queryn"
version = "0.1.0"
description = "Offline-first multi-agent AI research platform"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "langgraph==1.0.8",
    "numpy==2.2.1",
]

[project.optional-dependencies]
openrouter = [
    "tensorzero==2025.11.1",
    "httpx==0.28.1",
]
redis = [
    "redis==5.2.1",
]
postgres = [
    "psycopg[binary]==3.2.3",
]
bedrock = [
    "boto3==1.35.90",
    "botocore==1.35.90",
]
pdf = [
    "fpdf2==2.8.2",
]
redteam = [
    "pyrit==0.8.1",
]

[dependency-groups]
dev = [
    "ruff==0.8.4",
    "mypy==1.14.0",
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "httpx==0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["fpdf", "fpdf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
